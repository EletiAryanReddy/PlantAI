{% extends 'base.html' %}

{% block pagetitle %}
Signup
{% endblock pagetitle %}

{% block body %}

<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">

    <div class="card shadow-lg p-5" style="max-width:500px;width:100%;border-radius:25px;">

        <div class="text-center mb-4">

            <h1 class="fw-bold text-success">
                🌿 Create Account
            </h1>

            <p class="text-muted">
                Join AI Plant Disease Detection
            </p>

        </div>

        <form method="POST">

            <div class="mb-3">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                >

            </div>
            
<div class="mb-3">

    <label>Email</label>

    <input
        type="email"
        name="email"
        class="form-control"
        required
    >

</div>

<div class="mb-3">

    <label>Phone Number</label>

    <input
        type="text"
        name="phone"
        class="form-control"
        pattern="[0-9]{10}"
        maxlength="10"
        required
    >

</div>

<div class="mb-3">

    <label>Password</label>

    <input
        type="password"
        name="password"
        class="form-control"
        required
    >

</div>


            <button class="btn btn-success w-100 py-2">

                Create Account

            </button>

        </form>

        <div class="text-center mt-4">

            <p>
                Already have an account?
                <a href="/login">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock body %}
