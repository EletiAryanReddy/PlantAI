<!DOCTYPE html>
<html>
<head>
    <title>Voice Assistant</title>

    <style>

        body{
            font-family: Arial;
            background:#0f172a;
            color:white;
            text-align:center;
            padding-top:100px;
        }

        button{
            padding:15px 30px;
            font-size:20px;
            border:none;
            border-radius:10px;
            background:#22c55e;
            color:white;
            cursor:pointer;
        }

        #result{
            margin-top:30px;
            font-size:22px;
        }

    </style>
</head>
<body>

    <h1>🎤 Voice Assistant</h1>

    <button onclick="startVoice()">
        Speak
    </button>

    <div id="result"></div>

<script>

function startVoice(){

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event){

        let text =
            event.results[0][0].transcript;

        document.getElementById(
            "result"
        ).innerHTML =
            "You Said: " + text;

        speakText(text);
    };
}

function speakText(text){

    let speech =
        new SpeechSynthesisUtterance();

    speech.text =
        "You said " + text;

    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
