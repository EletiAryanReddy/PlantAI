<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block pagetitle %}
        PlantAI
        {% endblock pagetitle %}
    </title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- GOOGLE FONT -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{

            background:
            linear-gradient(
                135deg,
                #eefbf0,
                #f8fff8
            );

            min-height: 100vh;

            display: flex;

            flex-direction: column;
        }

        /* =======================
           NAVBAR
        ======================= */

        .navbar{

            background:
            rgba(8, 48, 20, 0.95);

            backdrop-filter: blur(10px);

            padding: 15px 0;

            box-shadow:
            0 5px 20px rgba(0,0,0,0.1);
        }

        .navbar-brand{

            font-size: 24px;

            font-weight: 700;

            color: #fff !important;
        }

        .nav-link{

            color: #fff !important;

            margin-left: 15px;

            font-weight: 500;

            transition: 0.3s;
        }

        .nav-link:hover{

            color: #8df5a6 !important;

            transform: translateY(-2px);
        }

        /* =======================
           CONTAINER
        ======================= */

        .main-container{

            flex: 1;

            padding-top: 40px;

            padding-bottom: 50px;
        }

        /* =======================
           CARD
        ======================= */

        .custom-card{

            background: #fff;

            border-radius: 25px;

            padding: 30px;

            border: none;

            box-shadow:
            0 10px 30px rgba(0,0,0,0.08);

            transition: 0.3s;
        }

        .custom-card:hover{

            transform: translateY(-5px);

            box-shadow:
            0 15px 40px rgba(0,0,0,0.12);
        }

        /* =======================
           BUTTON
        ======================= */

        .btn-custom{

            background:
            linear-gradient(
                to right,
                #0b6623,
                #16a34a
            );

            border: none;

            color: white;

            padding: 12px 30px;

            border-radius: 50px;

            font-weight: 600;

            transition: 0.3s;
        }

        .btn-custom:hover{

            transform: scale(1.03);

            color: white;

            background:
            linear-gradient(
                to right,
                #16a34a,
                #0b6623
            );
        }

        /* =======================
           INPUTS
        ======================= */

        .form-control{

            border-radius: 15px;

            padding: 12px;

            border: 1px solid #d8e8da;
        }

        .form-control:focus{

            border-color: #16a34a;

            box-shadow:
            0 0 0 0.15rem rgba(22,163,74,0.2);
        }

        /* =======================
           FILE INPUT
        ======================= */

        input[type="file"]{

            padding: 10px;
        }

        /* =======================
           TITLES
        ======================= */

        .main-title{

            font-size: 40px;

            font-weight: 700;

            color: #0b6623;
        }

        .sub-title{

            color: #4b6351;

            font-size: 18px;
        }

        /* =======================
           FOOTER
        ======================= */

        .footer{

            background: #062d12;

            color: white;

            padding: 50px 20px;

            margin-top: auto;
        }

        .footer h4{

            font-weight: 700;
        }

        .footer p{

            color: #d2d2d2;
        }

        .footer a{

            color: white;

            text-decoration: none;

            transition: 0.3s;
        }

        .footer a:hover{

            color: #8df5a6;
        }

        .social-icons a{

            width: 45px;

            height: 45px;

            display: inline-flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            background: rgba(255,255,255,0.1);

            margin: 0 8px;

            font-size: 20px;

            transition: 0.3s;
        }

        .social-icons a:hover{

            background: #16a34a;

            transform: translateY(-3px);
        }

        /* =======================
           RESPONSIVE
        ======================= */

        @media(max-width:768px){

            .main-title{

                font-size: 30px;
            }

            .nav-link{

                margin-left: 0;
            }
        }

    </style>

</head>

<body>

    <!-- =======================
         NAVBAR
    ======================== -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="/">
                🌱 PlantAI
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/index">
                            AI Engine
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/weather">
                            Weather
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/camera">
                            Camera
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/voice">
                            Voice
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/chatbot">
                            AI Chatbot
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/history">
                            History
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/market">
                            Supplements
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contact">
                            Contact
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-warning" href="/logout">
                            Logout
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- =======================
         BODY
    ======================== -->

    <div class="container main-container">

        {% block body %}

        {% endblock body %}

    </div>

    <!-- =======================
         FOOTER
    ======================== -->

    <footer class="footer">

        <div class="container text-center">

            <h4>
                🌿 AI Plant Disease Detection System
            </h4>

            <p class="mt-3">
                Smart Farming • Deep Learning • AI Agriculture
            </p>

            <div class="social-icons mt-4 mb-4">

                <a
                    href="mailto:eletiaryanreddy@gmail.com"
                >
                    <i class="fas fa-envelope"></i>
                </a>

                <a
                    href="https://linkedin.com"
                    target="_blank"
                >
                    <i class="fab fa-linkedin"></i>
                </a>

                <a
                    href="https://instagram.com"
                    target="_blank"
                >
                    <i class="fab fa-instagram"></i>
                </a>

                <a
                    href="https://github.com"
                    target="_blank"
                >
                    <i class="fab fa-github"></i>
                </a>

            </div>

            <p>
                © 2026 Created by
                <b>Eleti Aryan Reddy</b>
            </p>

        </div>

    </footer>

    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
